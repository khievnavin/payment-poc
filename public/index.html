<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment Test Console</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1b1f24; --muted: #667085;
    --border: #e3e6ea; --accent: #2f6fed; --accent-text: #fff;
    --ok: #12805c; --ok-bg: #e6f6ef; --warn: #b54708; --warn-bg: #fef3e6;
    --err: #c0362c; --err-bg: #fdecea; --info: #475467; --info-bg: #eef1f4;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #8b95a3;
      --border: #2a3039; --accent: #5b8cff; --accent-text: #0b0e12;
      --ok: #4cc79a; --ok-bg: #12291f; --warn: #f2a65a; --warn-bg: #2d1f10;
      --err: #f07a70; --err-bg: #2e1513; --info: #b4bcc8; --info-bg: #222831;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 14px; }
  .muted { color: var(--muted); }
  .grid { display: grid; grid-template-columns: 340px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .stack > * + * { margin-top: 16px; }
  label { display: block; font-weight: 500; margin-bottom: 4px; }
  .field + .field { margin-top: 12px; }
  input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--text); font: inherit; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button { font: inherit; font-weight: 500; padding: 8px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); width: 100%; margin-top: 16px; }
  button:disabled { opacity: .55; cursor: default; }
  button.small { padding: 4px 10px; font-size: 13px; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .presets button { padding: 3px 9px; font-size: 12px; color: var(--muted); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td code, .mono { font-family: var(--mono); font-size: 12px; }
  .id { cursor: pointer; color: var(--accent); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .COMPLETED { color: var(--ok); background: var(--ok-bg); }
  .PENDING { color: var(--warn); background: var(--warn-bg); }
  .FAILED { color: var(--err); background: var(--err-bg); }
  .REFUNDED { color: var(--info); background: var(--info-bg); }
  .empty { padding: 28px 8px; text-align: center; color: var(--muted); }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .toolbar h2 { margin: 0; }
  .log { max-height: 360px; overflow: auto; }
  .entry { border-top: 1px solid var(--border); padding: 10px 0; }
  .entry:first-child { border-top: 0; padding-top: 0; }
  .entry-head { display: flex; gap: 8px; align-items: center; font-family: var(--mono); font-size: 12px; }
  .code { font-weight: 700; }
  .code.ok { color: var(--ok); } .code.bad { color: var(--err); }
  pre { margin: 6px 0 0; padding: 10px; background: var(--bg); border-radius: 6px; overflow-x: auto;
    font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Payment Test Console</h1>
    <span class="muted">API: <code class="mono" id="apiBase"></code></span>
  </header>

  <div class="grid">
    <div class="stack">
      <form class="panel" id="createForm" novalidate>
        <h2>Create payment</h2>
        <div class="field">
          <label for="orderId">Order ID</label>
          <div class="row">
            <input id="orderId" name="orderId" required>
            <button type="button" class="small" id="newOrder" style="flex:0 0 auto">New</button>
          </div>
        </div>
        <div class="field row">
          <div>
            <label for="amount">Amount</label>
            <input id="amount" name="amount" type="number" step="0.01" value="10.00">
          </div>
          <div>
            <label for="currency">Currency</label>
            <select id="currency" name="currency">
              <option>USD</option><option>EUR</option><option>KHR</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="method">Method <span class="muted">(optional, defaults to card)</span></label>
          <select id="method" name="method">
            <option value="">— omit —</option>
            <option>card</option><option>bank_transfer</option><option>wallet</option><option>cash</option>
          </select>
        </div>
        <button class="primary" type="submit" id="submitBtn">Create payment</button>
        <div class="presets" aria-label="Invalid input presets">
          <span class="muted" style="font-size:12px;align-self:center">Try invalid:</span>
          <button type="button" data-preset="zero">amount 0</button>
          <button type="button" data-preset="currency">currency JPY</button>
          <button type="button" data-preset="string">amount as string</button>
          <button type="button" data-preset="empty">empty body</button>
        </div>
      </form>

      <form class="panel" id="lookupForm">
        <h2>Look up by ID</h2>
        <div class="row">
          <input id="lookupId" placeholder="payment id" class="mono">
          <button type="submit" style="flex:0 0 auto">Get</button>
        </div>
      </form>
    </div>

    <div class="stack">
      <section class="panel">
        <div class="toolbar">
          <h2>Payments <span class="muted" id="count"></span></h2>
          <button class="small" id="refresh">Refresh</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Order</th><th style="text-align:right">Amount</th><th>Method</th><th>Status</th><th>Created</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="toolbar">
          <h2>Request log</h2>
          <button class="small" id="clearLog">Clear</button>
        </div>
        <div class="log" id="log"><div class="empty">Requests and responses will appear here.</div></div>
      </section>
    </div>
  </div>
</div>

<script>
  const API = location.origin + '/payments';
  const $ = (id) => document.getElementById(id);
  $('apiBase').textContent = API;

  const randomOrderId = () => 'ORD-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  $('orderId').value = randomOrderId();
  $('newOrder').onclick = () => { $('orderId').value = randomOrderId(); };

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function logEntry(method, url, body, status, data) {
    const log = $('log');
    if (log.querySelector('.empty')) log.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'entry';
    const ok = status >= 200 && status < 300;
    el.innerHTML =
      `<div class="entry-head"><span class="code ${ok ? 'ok' : 'bad'}">${status || 'ERR'}</span>` +
      `<span>${method} ${esc(url.replace(location.origin, ''))}</span>` +
      `<span class="muted" style="margin-left:auto">${new Date().toLocaleTimeString()}</span></div>` +
      (body !== undefined ? `<pre>→ ${esc(JSON.stringify(body, null, 2))}</pre>` : '') +
      `<pre>← ${esc(typeof data === 'string' ? data : JSON.stringify(data, null, 2))}</pre>`;
    log.prepend(el);
  }

  async function call(method, path, body) {
    const url = API + path;
    let status = 0, data;
    try {
      const res = await fetch(url, {
        method,
        headers: body !== undefined ? { 'Content-Type': 'application/json' } : undefined,
        body: body !== undefined ? JSON.stringify(body) : undefined,
      });
      status = res.status;
      const text = await res.text();
      try { data = text ? JSON.parse(text) : null; } catch { data = text; }
    } catch (e) {
      data = 'Network error: ' + e.message;
    }
    logEntry(method, url, body, status, data);
    return { ok: status >= 200 && status < 300, data };
  }

  function fmtAmount(p) {
    try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: p.currency }).format(p.amount); }
    catch { return p.amount + ' ' + p.currency; }
  }

  function render(payments) {
    $('count').textContent = `(${payments.length})`;
    if (!payments.length) {
      $('rows').innerHTML = '<tr><td colspan="7" class="empty">No payments yet. Create one on the left.</td></tr>';
      return;
    }
    payments.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    $('rows').innerHTML = payments.map((p) => `
      <tr>
        <td><code class="id" title="${esc(p.id)} — click to look up" data-id="${esc(p.id)}">${esc(p.id.slice(0, 8))}…</code></td>
        <td>${esc(p.orderId)}</td>
        <td class="num">${esc(fmtAmount(p))}</td>
        <td>${esc(p.method)}</td>
        <td><span class="badge ${esc(p.status)}">${esc(p.status)}</span></td>
        <td class="muted">${new Date(p.createdAt).toLocaleTimeString()}</td>
        <td><button class="small" data-refund="${esc(p.id)}">Refund</button></td>
      </tr>`).join('');
  }

  async function refresh() {
    const { ok, data } = await call('GET', '');
    if (ok && Array.isArray(data)) render(data);
  }

  $('createForm').onsubmit = async (e) => {
    e.preventDefault();
    const body = {
      orderId: $('orderId').value,
      amount: Number($('amount').value),
      currency: $('currency').value,
    };
    if ($('method').value) body.method = $('method').value;
    $('submitBtn').disabled = true;
    const { ok } = await call('POST', '', body);
    $('submitBtn').disabled = false;
    if (ok) { $('orderId').value = randomOrderId(); refresh(); }
  };

  const presets = {
    zero: { orderId: randomOrderId(), amount: 0, currency: 'USD' },
    currency: { orderId: randomOrderId(), amount: 10, currency: 'JPY' },
    string: { orderId: randomOrderId(), amount: '10', currency: 'USD' },
    empty: {},
  };
  document.querySelectorAll('[data-preset]').forEach((b) => {
    b.onclick = () => call('POST', '', presets[b.dataset.preset]);
  });

  $('rows').onclick = async (e) => {
    const refundId = e.target.dataset.refund;
    const lookupId = e.target.dataset.id;
    if (refundId) {
      await call('POST', `/${encodeURIComponent(refundId)}/refund`, { reason: 'Test refund from UI' });
      refresh();
    } else if (lookupId) {
      $('lookupId').value = lookupId;
      call('GET', `/${encodeURIComponent(lookupId)}`);
    }
  };

  $('lookupForm').onsubmit = (e) => {
    e.preventDefault();
    const id = $('lookupId').value.trim();
    if (id) call('GET', `/${encodeURIComponent(id)}`);
  };

  $('refresh').onclick = refresh;
  $('clearLog').onclick = () => { $('log').innerHTML = '<div class="empty">Requests and responses will appear here.</div>'; };

  refresh();
</script>
</body>
</html>
