services:
  db:
    image: postgres:17-alpine
    container_name: payment-service-db
    environment:
      POSTGRES_USER: payment_service
      POSTGRES_PASSWORD: payment_service
      POSTGRES_DB: payment_service
    ports:
      # This machine only (5434 is the government portal's database).
      - '127.0.0.1:5436:5432'
    volumes:
      - payment-db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: payment-service-redis
    ports:
      # This machine only.
      - '127.0.0.1:6479:6379'

  # The service itself runs with `npm run dev`. Only one copy may run: every
  # copy answers the same Redis messages. Docker instead: docker compose --profile app up -d
  # (stop npm run dev first).
  payment-service:
    profiles: ['app']
    build: .
    container_name: payment-service
    ports:
      # Host port 3100 (3000 is the government portal API); the service still listens on 3000 inside the container.
      - '127.0.0.1:3100:3100'
    environment:
      - PORT=3100
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgres://payment_service:payment_service@db:5432/payment_service
    depends_on:
      - db
      - redis

volumes:
  payment-db:
