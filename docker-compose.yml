version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: payment-service-redis
    ports:
      - '6479:6379'

  payment-service:
    build: .
    container_name: payment-service
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
